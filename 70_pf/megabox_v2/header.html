<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEET PLAY SHARE, 메가박스</title>
    <style>
        @import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css');
        @import url('./css/font.css');

        /* reset */
        * {
            box-sizing: border-box;
        }

        body,
        h1,
        ul {
            margin: 0;
            font-family: 'NanumBarunGothic';
            line-height: 1.5;
            font-size: 15px;
        }

        ul {
            padding: 0;
            list-style: none;
        }

        a {
            text-decoration: none;
        }

        img {
            vertical-align: middle;
        }

        /* header common */
        #header {
            z-index: 1;
            position: absolute;
            width: 100%;
            border-bottom: 1px solid rgba(255, 255, 255, .2);
            padding: 15px;
        }

        #header .inner {
            max-width: 1100px;
            margin: 0 auto;
        }

        #header a {
            color: #fff;
        }

        /* logo */
        #logo {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        /* top menu */
        #header .top_link {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        #header .top_link a {
            font-size: 13px;
            color: #888;
        }

        #header .left_link a {
            margin-right: 20px;
        }

        #header .right_link a {
            margin-left: 20px;
        }

        /* link icon */
        #header .link_icon {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* GNB common */
        #gnb {
            position: absolute;
            width: 100%;
            left: 50%;
            top: 50px;
            transform: translateX(-50%);
            max-width: 900px;
            margin: 0 auto;
        }

        /* 1depth */
        #gnb .main {
            display: flex;
            justify-content: space-evenly;
            align-content: flex-end;
        }

        #gnb .main a {
            position: relative;
            font-size: 18px;
        }

        #gnb .main>li:not(:nth-of-type(5))>a:hover::after {
            position: absolute;
            bottom: -25px;
            content: '';
            width: 100%;
            height: 3px;
            transform: translateX(-100%);
            background: #fff;
        }

        #gnb .main>li:nth-of-type(3) {
            margin-right: 150px;
        }

        #gnb .main>li:nth-of-type(4) {
            margin-left: 150px;
        }

        #gnb .main li:hover .sub {
            display: flex;
        }

        /* 2depth */
        #gnb .sub {
            position: absolute;
            transform: translateX(-30%);
            padding-top: 30px;
            display: none;
        }

        #gnb .sub:last-of-type {
            text-wrap: nowrap;
        }

        #gnb .sub li {
            margin: 0 8px;
        }

        #gnb .sub a {
            font-size: 15px;
        }

        #gnb .sub a:hover {
            text-decoration: underline;
        }

    </style>
</head>

<body>
    <header id="header">
        <div class="inner">
            <h1 id="logo"><a href="index.html"><img src="images/logo-white_new2.png" alt="메가박스"></a></h1>
            <div class="top_link">
                <div class="left_link">
                    <a href="#">VIP LOUNGE</a>
                    <a href="#">멤버십</a>
                    <a href="#">고객센터</a>
                </div>
                <div class="right_link">
                    <a href="#">로그인</a>
                    <a href="#">회원가입</a>
                    <a href="#">빠른예매</a>
                </div>
            </div>
            <nav id="gnb">
                <ul class="main">
                    <li><a href="#">영화</a>
                        <ul class="sub">
                            <li><a href="#">전체영화</a></li>
                        </ul>
                    </li>
                    <li><a href="#">예매</a>
                        <ul class="sub">
                            <li><a href="#">빠른예매</a></li>
                            <li><a href="#">상영시간표</a></li>
                            <li><a href="#">더 부티크 프라이빗 예매</a></li>
                        </ul>
                    </li>
                    <li><a href="#">극장</a>
                        <ul class="sub">
                            <li><a href="#">전체극장</a></li>
                            <li><a href="sub/specialized_theaters.html">특별관</a></li>
                        </ul>
                    </li>
                    <li><a href="#">이벤트</a>
                        <ul class="sub">
                            <li><a href="#">진행중 이벤트</a></li>
                            <li><a href="#">지난 이벤트</a></li>
                            <li><a href="#">당첨자발표</a></li>
                        </ul>
                    </li>
                    <li><a href="#">스토어</a></li>
                    <li><a href="#">혜택</a>
                        <ul class="sub">
                            <li><a href="#">메가박스 멤버십</a></li>
                            <li><a href="#">제휴/할인</a></li>
                        </ul>
                    </li>
                </ul>
            </nav>
            <div class="link_icon">
                <div class="left_link">
                    <a href="#"><img src="images/ico-sitemap-white.png" alt=""></a>
                    <a href="#"><img src="images/ico-search-white.png" alt=""></a>
                </div>
                <div class="right_link">
                    <a href="#"><img src="images/ico-schedule-white.png" alt=""></a>
                    <a href="#"><img src="images/ico-mymega-white.png" alt=""></a>
                </div>
            </div>
        </div>
    </header>

</body>

</html>
